version: '3.8'

services:
  app:
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev
    environment:
      - NODE_ENV=development

  migration:
    build: .
    command: npm run migration:generate
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@db:5432/home_library
    depends_on:
      - db
    networks:
      - app-network
